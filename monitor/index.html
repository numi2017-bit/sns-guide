<meta name="dash-one-writer">
<style>
.bm{display:grid;gap:var(--cds-gap-xl);font-family:var(--font-anthropic-sans);color:var(--color-fg)}
.bm h1{font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);margin:0;text-wrap:balance}
.bm h2{font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium);margin:0}
.bm .lede{margin:var(--cds-gap-xs) 0 0;color:var(--color-fg-muted);max-width:68ch}
.bm .lede b{color:var(--color-fg);font-weight:var(--cds-font-weight-medium)}
.bm .note{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);margin:0}
.bm-groups{display:grid;gap:var(--cds-gap-lg);grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.bm-group{display:grid;gap:var(--cds-gap-sm);align-content:start}
.bm-group h3{margin:0;font-size:var(--cds-font-size-caption);letter-spacing:.06em;color:var(--color-fg-muted);font-weight:var(--cds-font-weight-medium)}
.bm-tiles{display:grid;gap:var(--cds-gap-sm);grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.bm-tile{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-md);display:grid;gap:2px;min-width:0}
.bm-tile .name{font-weight:var(--cds-font-weight-medium)}
.bm-tile .num{font-family:var(--font-anthropic-serif);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.bm-tile .split{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);font-variant-numeric:tabular-nums}
.bm-tile.zero .num{color:var(--color-fg-muted)}
.bm-heat-wrap{overflow-x:auto}
.bm-heat{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:var(--cds-font-size-caption)}
.bm-heat th,.bm-heat td{padding:6px 8px;text-align:center;white-space:nowrap}
.bm-heat th{font-weight:400;color:var(--cds-text-secondary)}
.bm-heat th.b{text-align:left;color:var(--color-fg);font-weight:var(--cds-font-weight-medium)}
.bm-heat td{border-radius:4px;min-width:34px}
.bm-filters{display:flex;flex-wrap:wrap;gap:var(--cds-gap-sm);align-items:center}
.bm-filters input{font:inherit;padding:6px 10px;border:1px solid var(--color-border-line);border-radius:var(--cds-radius);background:var(--color-bg);color:var(--color-fg);min-width:0;flex:1 1 160px}
.bm-count{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.bm-feed-wrap{overflow-x:auto;min-height:200px}
.bm-feed{width:100%;border-collapse:collapse}
.bm-feed th{text-align:left;font-size:var(--cds-font-size-caption);color:var(--cds-text-secondary);font-weight:400;padding:6px 8px;border-bottom:1px solid var(--color-border-line);white-space:nowrap}
.bm-feed td{padding:8px;border-bottom:1px solid var(--color-border-line);vertical-align:top}
.bm-feed td.t{min-width:260px}
.bm-feed td.w{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.bm-feed a{color:var(--color-fg);text-decoration:none}
.bm-feed a:hover,.bm-feed a:focus-visible{text-decoration:underline}
.bm-chip{display:inline-block;font-size:var(--cds-font-size-caption);padding:1px 8px;border-radius:999px;border:1px solid var(--color-border-line);white-space:nowrap}
.bm-chip.own{border-color:transparent;background:var(--color-fg);color:var(--color-bg)}
.bm-chip.new{border-color:var(--color-ok);color:var(--color-ok)}
.bm-empty{color:var(--color-fg-muted);padding:var(--cds-pad-lg) 0}
</style>

<div class="bm">
  <header id="top">
    <h1>침대 브랜드 데일리 모니터</h1>
    <p class="lede" data-draw="lede">—</p>
    <p class="note">뉴스는 Google 뉴스, 유튜브는 공식 채널 새 영상과 브랜드명이 제목·채널명에 들어간 오늘 업로드 영상을 매일 오전 8시 40분(한국시간)에 모읍니다. 인스타그램은 로그인 없이 수집할 수 없어 아직 빠져 있습니다.</p>
  </header>

  <section id="today" class="bm-groups">
    <div class="bm-group">
      <h3>자사 · 최근 수집분</h3>
      <div class="bm-tiles" data-draw="tiles-own" data-source="by_brand"></div>
    </div>
    <div class="bm-group">
      <h3>경쟁사 · 최근 수집분</h3>
      <div class="bm-tiles" data-draw="tiles-rival" data-source="by_brand"></div>
    </div>
  </section>

  <section id="daily" style="display:grid;gap:var(--cds-gap-sm)">
    <h2>날짜별 새 글 수</h2>
    <p class="note">칸이 진할수록 그날 새로 잡힌 글이 많습니다. 기록은 최근 45일까지 보관합니다.</p>
    <div class="bm-heat-wrap" data-draw="heat" data-source="daily"></div>
  </section>

  <section id="feed" style="display:grid;gap:var(--cds-gap-md)">
    <h2>새 글 목록</h2>
    <div class="bm-filters">
      <select class="dash-select" id="f-brand" aria-label="브랜드" data-draw="f-brand" data-source="items"></select>
      <select class="dash-select" id="f-channel" aria-label="채널">
        <option value="">뉴스·유튜브 전체</option>
        <option value="뉴스">뉴스</option>
        <option value="유튜브">유튜브</option>
      </select>
      <select class="dash-select" id="f-day" aria-label="수집일" data-draw="f-day" data-source="items"></select>
      <input id="f-q" type="search" placeholder="제목·출처 검색" aria-label="제목·출처 검색">
    </div>
    <p class="bm-count" data-draw="feed-count">—</p>
    <div class="bm-feed-wrap">
      <table class="bm-feed" data-source="items" data-row-key="링크">
        <thead><tr>
          <th data-field="브랜드">브랜드</th>
          <th data-field="채널">채널</th>
          <th data-field="제목">제목</th>
          <th data-field="출처">출처</th>
          <th data-field="게시시각">게시 (한국시간)</th>
        </tr></thead>
        <tbody data-draw="feed-rows"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
window.BM = { brand: '', channel: '', day: '', q: '' };
window.BM_ORDER = ['시몬스', 'N32', '몽클로스', '베스트슬립', '씰리', '템퍼', '에이스', '코웨이'];

dash.calc('by_brand', {
  title: '브랜드별 최근 수집분',
  description: '가장 최근 수집일에 새로 잡힌 글을 브랜드·채널별로 센 값',
  inputs: ['items'],
  fn: (items) => {
    const last = items.reduce((m, r) => (r['수집일'] > m ? r['수집일'] : m), '');
    const order = ['시몬스', 'N32', '몽클로스', '베스트슬립', '씰리', '템퍼', '에이스', '코웨이'];
    const own = new Set(['시몬스', 'N32', '몽클로스']);
    return order.map((b) => {
      const rs = items.filter((r) => r['브랜드'] === b && r['수집일'] === last);
      const n = rs.filter((r) => r['채널'] === '뉴스').length;
      const y = rs.filter((r) => r['채널'] === '유튜브').length;
      return { 브랜드: b, 구분: own.has(b) ? '자사' : '경쟁사', 수집일: last, 뉴스: n, 유튜브: y, 합계: n + y };
    });
  },
});

dash.calc('daily', {
  title: '날짜별·브랜드별 새 글 수',
  description: '수집일마다 브랜드별로 새로 잡힌 글 수',
  inputs: ['items'],
  fn: (items) => {
    const out = new Map();
    for (const r of items) {
      const k = r['브랜드'] + '|' + r['수집일'];
      out.set(k, (out.get(k) || 0) + 1);
    }
    return [...out].map(([k, n]) => { const [b, d] = k.split('|'); return { 브랜드: b, 수집일: d, 건수: n }; });
  },
});
</script>

<script>
(function () {
  const md = (d) => { const [, m, day] = d.split('-'); return (+m) + '/' + (+day); };

  dash.draw('lede', (el) => {
    const g = dash.data('by_brand');
    el.replaceChildren();
    if (g.status !== 'ok' || !g.data.length) { el.textContent = '—'; return; }
    const rows = g.data;
    const sum = (k) => rows.filter((r) => r['구분'] === k).reduce((s, r) => s + r['합계'], 0);
    const top = rows.slice().sort((a, b) => b['합계'] - a['합계'])[0];
    const add = (t, strong) => { const n = document.createElement(strong ? 'b' : 'span'); n.textContent = t; el.append(n); };
    add(md(rows[0]['수집일']) + ' 수집분은 자사 ');
    add(sum('자사') + '건', true);
    add(', 경쟁사 ');
    add(sum('경쟁사') + '건', true);
    add('입니다.');
    if (top && top['합계'] > 0) { add(' 가장 많이 나온 곳은 '); add(top['브랜드'] + ' ' + top['합계'] + '건', true); add('이에요.'); }
  });

  function tiles(group) {
    return (el) => {
      const g = dash.data('by_brand');
      el.replaceChildren();
      if (g.status !== 'ok') { el.textContent = '—'; return; }
      for (const r of g.data.filter((x) => x['구분'] === group)) {
        const t = document.createElement('div');
        t.className = 'bm-tile' + (r['합계'] ? '' : ' zero');
        t.id = 'tile-' + r['브랜드'];
        const w = '브랜드=' + encodeURIComponent(r['브랜드']);
        const name = document.createElement('div'); name.className = 'name'; name.textContent = r['브랜드'];
        const num = document.createElement('div'); num.className = 'num';
        Object.assign(num.dataset, { source: 'by_brand', field: '합계', where: w }); num.textContent = r['합계'];
        const split = document.createElement('div'); split.className = 'split';
        const a = document.createElement('span'); Object.assign(a.dataset, { source: 'by_brand', field: '뉴스', where: w }); a.textContent = r['뉴스'];
        const b = document.createElement('span'); Object.assign(b.dataset, { source: 'by_brand', field: '유튜브', where: w }); b.textContent = r['유튜브'];
        split.append('뉴스 ', a, ' · 유튜브 ', b);
        t.append(name, num, split);
        t.style.cursor = 'pointer';
        t.tabIndex = 0;
        t.title = r['브랜드'] + ' 글만 보기';
        const pick = () => { BM.brand = r['브랜드']; BM.day = r['수집일']; dash.draw('f-brand'); dash.draw('f-day'); dash.draw('feed-rows'); dash.draw('feed-count'); };
        t.onclick = pick;
        t.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
        el.append(t);
      }
    };
  }
  dash.draw('tiles-own', tiles('자사'));
  dash.draw('tiles-rival', tiles('경쟁사'));

  dash.draw('heat', (el) => {
    const g = dash.data('daily');
    el.replaceChildren();
    if (g.status !== 'ok') { el.textContent = g.status === 'error' ? '불러오지 못했습니다' : '—'; return; }
    const days = [...new Set(g.data.map((r) => r['수집일']))].sort().slice(-14);
    const max = Math.max(1, ...g.data.map((r) => r['건수']));
    const t = document.createElement('table'); t.className = 'bm-heat';
    const hr = t.insertRow(); hr.append(document.createElement('th'));
    for (const d of days) { const th = document.createElement('th'); th.textContent = md(d); hr.append(th); }
    for (const b of BM_ORDER) {
      const tr = t.insertRow();
      const th = document.createElement('th'); th.className = 'b'; th.textContent = b; tr.append(th);
      for (const d of days) {
        const r = g.data.find((x) => x['브랜드'] === b && x['수집일'] === d);
        const td = tr.insertCell();
        const n = r ? r['건수'] : 0;
        td.textContent = n || '·';
        if (r) Object.assign(td.dataset, { source: 'daily', field: '건수', where: '브랜드=' + encodeURIComponent(b) + '&수집일=' + d });
        const k = n / max;
        td.style.background = n ? `color-mix(in srgb, ${dash.colors[0]} ${Math.round(15 + 70 * k)}%, transparent)` : 'transparent';
        td.style.color = k > 0.55 ? 'var(--color-bg)' : (n ? 'var(--color-fg)' : 'var(--color-fg-muted)');
      }
    }
    el.append(t);
  });

  dash.draw('f-brand', (sel) => {
    const g = dash.data('items');
    const have = g.status === 'ok' ? new Set(g.data.map((r) => r['브랜드'])) : new Set();
    sel.replaceChildren(new Option('브랜드 전체', ''), new Option('자사만', '@자사'), new Option('경쟁사만', '@경쟁사'),
      ...BM_ORDER.filter((b) => have.has(b)).map((b) => new Option(b, b)));
    sel.value = BM.brand;
    sel.onchange = () => { BM.brand = sel.value; dash.draw('feed-rows'); dash.draw('feed-count'); };
  });

  dash.draw('f-day', (sel) => {
    const g = dash.data('items');
    const days = g.status === 'ok' ? [...new Set(g.data.map((r) => r['수집일']))].sort().reverse() : [];
    sel.replaceChildren(new Option('모든 날짜', ''), ...days.map((d) => new Option(md(d) + ' 수집', d)));
    sel.value = days.includes(BM.day) ? BM.day : '';
    sel.onchange = () => { BM.day = sel.value; dash.draw('feed-rows'); dash.draw('feed-count'); };
  });

  for (const ch of document.querySelectorAll('#f-channel')) ch.addEventListener('change', () => { BM.channel = ch.value; dash.draw('feed-rows'); dash.draw('feed-count'); });
  for (const q of document.querySelectorAll('#f-q')) q.addEventListener('input', () => { BM.q = q.value.trim().toLowerCase(); dash.draw('feed-rows'); dash.draw('feed-count'); });

  window.BM_filtered = function () {
    const g = dash.data('items');
    if (g.status !== 'ok') return null;
    return g.data.filter((r) =>
      (!BM.brand || (BM.brand[0] === '@' ? r['구분'] === BM.brand.slice(1) : r['브랜드'] === BM.brand)) &&
      (!BM.channel || r['채널'] === BM.channel) &&
      (!BM.day || r['수집일'] === BM.day) &&
      (!BM.q || (r['제목'] + ' ' + r['출처']).toLowerCase().includes(BM.q)));
  };

  dash.draw('feed-count', (el) => {
    const rows = BM_filtered();
    el.textContent = rows ? rows.length + '건' : '—';
  });

  dash.draw('feed-rows', (tb) => {
    const g = dash.data('items');
    tb.replaceChildren();
    const rows = BM_filtered();
    if (!rows) {
      const td = tb.insertRow().insertCell(); td.colSpan = 5; td.className = 'bm-empty';
      td.textContent = g.status === 'error' ? '목록을 불러오지 못했습니다.' : '불러오는 중…';
      return;
    }
    if (!rows.length) {
      const td = tb.insertRow().insertCell(); td.colSpan = 5; td.className = 'bm-empty';
      td.textContent = '조건에 맞는 글이 없습니다. 필터를 넓혀 보세요.';
      return;
    }
    const last = g.data.reduce((m, r) => (r['수집일'] > m ? r['수집일'] : m), '');
    for (const r of rows.slice(0, 300)) {
      const tr = tb.insertRow();
      tr.dataset.key = encodeURIComponent(r['링크']);
      const c1 = tr.insertCell(); const chip = document.createElement('span');
      chip.className = 'bm-chip' + (r['구분'] === '자사' ? ' own' : ''); chip.textContent = r['브랜드']; c1.append(chip);
      const c2 = tr.insertCell(); c2.className = 'w'; c2.textContent = r['채널'] + ' · ' + r['유형'];
      const c3 = tr.insertCell(); c3.className = 't';
      const a = document.createElement('a'); a.href = r['링크']; a.target = '_blank'; a.rel = 'noopener'; a.textContent = r['제목'];
      c3.append(a);
      if (r['수집일'] === last) { const n = document.createElement('span'); n.className = 'bm-chip new'; n.textContent = '새 글'; n.style.marginLeft = '6px'; c3.append(n); }
      const c4 = tr.insertCell(); c4.className = 'w'; c4.textContent = r['출처'];
      const c5 = tr.insertCell(); c5.className = 'w'; c5.textContent = r['게시시각'];
    }
    if (rows.length > 300) {
      const td = tb.insertRow().insertCell(); td.colSpan = 5; td.className = 'bm-empty';
      td.textContent = '앞의 300건만 보여 줍니다. 필터로 좁혀 보세요.';
    }
  });
})();
</script>
